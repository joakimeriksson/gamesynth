[model]
name = "campfire"
category = "nature"
doc = "Crackling campfire: sparks are dust impulses shaped into short noise bursts."

[inputs]
intensity = { default = 0.5, doc = "Embers to blaze" }

[params]
crackle_rate = { default = 40, min = 1, max = 400, scale = "exp", group = "crackle" }
crackle_hz = { default = 2000, min = 600, max = 8000, scale = "exp", group = "crackle" }
crackle_ms = { default = 1.5, min = 0.5, max = 40, group = "crackle" }
roar_hz = { default = 220, min = 60, max = 1200, scale = "exp", group = "roar" }
roar_level = { default = 0.6, min = 0, max = 1, group = "roar" }
gain = { default = 1.0, min = 0, max = 2, group = "master" }

[signals]
flutter = "1 + 0.4 * noise(6)"
colour = "crackle_hz * exp2(0.8 * noise(30))"
sparks_rate = "crackle_rate * (0.15 + 0.85 * intensity)"
size = "pow(0.5 + 0.5 * sh(120), 3)"

[graph]
nodes = [
  { id = "white", type = "noise" },
  { id = "brown", type = "noise", color = "brown" },
  { id = "sparks", type = "dust", rate = "sparks_rate" },
  { id = "env", type = "decay", in = ["sparks"], ms = "crackle_ms" },
  { id = "burst", type = "mul", in = ["white"], by = ["env"] },
  { id = "crack_bp", type = "svf", mode = "bandpass", in = ["burst"], cutoff = "colour", resonance = 0.1 },
  { id = "crack", type = "lowpass", in = ["crack_bp"], cutoff = 10000 },
  { id = "bangs", type = "dust", rate = "sparks_rate * 0.05" },
  { id = "bang_env", type = "decay", in = ["bangs"], ms = "crackle_ms * 1.3" },
  { id = "bang", type = "mul", in = ["white"], by = ["bang_env"] },
  { id = "bang_hp", type = "svf", mode = "bandpass", in = ["bang"], cutoff = 1500, resonance = 0.05 },
  { id = "fizz_dust", type = "dust", rate = "250 * (0.3 + 0.7 * intensity)" },
  { id = "fizz_env", type = "decay", in = ["fizz_dust"], ms = 0.7 },
  { id = "fizz_burst", type = "mul", in = ["white"], by = ["fizz_env"] },
  { id = "fizz_hp", type = "svf", mode = "highpass", in = ["fizz_burst"], cutoff = 1000, resonance = 0.1 },
  { id = "fizz", type = "lowpass", in = ["fizz_hp"], cutoff = 6000 },
  { id = "pops", type = "dust", rate = "sparks_rate * 0.08" },
  { id = "pop", type = "resonators", in = ["pops"], freqs = [260], resonance = 0.85 },
  { id = "roar", type = "svf", mode = "lowpass", in = ["brown"], cutoff = "roar_hz * (0.6 + 0.9 * intensity)", resonance = 0.25 },
  { id = "out", type = "gain", gain = "gain", in = [
      { from = "crack", gain = "10.0 * size" },
      { from = "bang_hp", gain = 9.0 },
      { from = "fizz", gain = "0.25 * (0.4 + 0.6 * intensity)" },
      { from = "pop", gain = 3.0 },
      { from = "roar", gain = "roar_level * (0.5 + 0.5 * intensity) * flutter * 0.5" } ] },
]
out = "out"
