# Showcases `modal` (struck metal tubes that keep ringing when struck again), `pattern`
# (gusts knock the clapper in little runs) and stereo output (`pan` + `out_right`).
[model]
name = "wind_chimes"
category = "nature"
doc = "Four metal tubes on a porch: the wind knocks the clapper into them in runs, each strike adds to the ring."

[inputs]
wind = { default = 0.4, doc = "Still air to a stiff breeze: how often and how hard the tubes are struck" }

[params]
pitch = { default = 1.0, min = 0.5, max = 2.0, scale = "exp", group = "tubes" }
size = { default = 0.5, min = 0, max = 1, group = "tubes" }
ring = { default = 1.0, min = 0.2, max = 3.0, scale = "exp", group = "tubes" }
width = { default = 0.8, min = 0, max = 1, group = "space" }
space = { default = 0.25, min = 0, max = 1, group = "space" }
gain = { default = 1.0, min = 0, max = 2, group = "master" }

[signals]
gust = "clamp(wind * (0.85 + 0.3 * noise(0.3)), 0, 1)"
knocks = "lerp(2.5, 9, gust)"
runs = "lerp(1, 4, gust)"
rest = "lerp(4, 0.3, gust)"
force = "0.3 + 0.7 * gust"
on = "wind > 0.03"

# A free-free bar (a chime tube): partials at 1, 2.76, 5.40 and 8.93 times the lowest.
[graph]
nodes = [
  { id = "k1", type = "pattern", rate = "knocks * 0.9", count = "runs", gap = "rest * 1.3", jitter = 0.8, variation = 0.9, run = "on" },
  { id = "k2", type = "pattern", rate = "knocks * 1.1", count = "runs", gap = "rest", jitter = 0.8, variation = 0.9, run = "on" },
  { id = "k3", type = "pattern", rate = "knocks", count = "runs", gap = "rest * 0.8", jitter = 0.8, variation = 0.9, run = "on" },
  { id = "k4", type = "pattern", rate = "knocks * 1.2", count = "runs", gap = "rest * 1.6", jitter = 0.8, variation = 0.9, run = "on" },
  { id = "t1", type = "modal", in = [{ from = "k1", gain = "force" }], freq = "880 * pitch", size = "size", decay = "ring", variation = 0.5,
    ratios = [1, 2.756, 5.404, 8.933], t60 = [4.0, 2.2, 1.1, 0.5], levels = [1, 0.7, 0.4, 0.2] },
  { id = "t2", type = "modal", in = [{ from = "k2", gain = "force" }], freq = "987.8 * pitch", size = "size", decay = "ring", variation = 0.5,
    ratios = [1, 2.756, 5.404, 8.933], t60 = [3.8, 2.1, 1.0, 0.5], levels = [1, 0.7, 0.4, 0.2] },
  { id = "t3", type = "modal", in = [{ from = "k3", gain = "force" }], freq = "1174.7 * pitch", size = "size", decay = "ring", variation = 0.5,
    ratios = [1, 2.756, 5.404, 8.933], t60 = [3.4, 1.9, 0.9, 0.4], levels = [1, 0.7, 0.4, 0.2] },
  { id = "t4", type = "modal", in = [{ from = "k4", gain = "force" }], freq = "1318.5 * pitch", size = "size", decay = "ring", variation = 0.5,
    ratios = [1, 2.756, 5.404, 8.933], t60 = [3.0, 1.7, 0.8, 0.4], levels = [1, 0.7, 0.4, 0.2] },
  { id = "l1", type = "pan", in = ["t1"], pan = "-0.7 * width", channel = "left" },
  { id = "r1", type = "pan", in = ["t1"], pan = "-0.7 * width", channel = "right" },
  { id = "l2", type = "pan", in = ["t2"], pan = "-0.25 * width", channel = "left" },
  { id = "r2", type = "pan", in = ["t2"], pan = "-0.25 * width", channel = "right" },
  { id = "l3", type = "pan", in = ["t3"], pan = "0.25 * width", channel = "left" },
  { id = "r3", type = "pan", in = ["t3"], pan = "0.25 * width", channel = "right" },
  { id = "l4", type = "pan", in = ["t4"], pan = "0.7 * width", channel = "left" },
  { id = "r4", type = "pan", in = ["t4"], pan = "0.7 * width", channel = "right" },
  { id = "mix_l", type = "gain", in = ["l1", "l2", "l3", "l4"], gain = "0.3 * gain" },
  { id = "mix_r", type = "gain", in = ["r1", "r2", "r3", "r4"], gain = "0.3 * gain" },
  { id = "left", type = "reverb", in = ["mix_l"], time = 1.6, mix = "space", damping = 0.5 },
  { id = "right", type = "reverb", in = ["mix_r"], time = 1.7, mix = "space", damping = 0.5 },
]
out = "left"
out_right = "right"

[presets.big_tubes]
pitch = 0.75
size = 0.75

[presets.tiny_bells]
pitch = 1.5
size = 0.25
ring = 0.6
