[model]
name = "steam_vent"
category = "machines"
doc = "Pressurised steam escaping through a pipe: resonant hiss that sputters at low pressure."

[inputs]
pressure = { default = 0.5, doc = "Leak to full blast" }

[params]
pipe_hz = { default = 900, min = 150, max = 4000, scale = "exp", group = "pipe" }
pipe_res = { default = 0.7, min = 0, max = 0.95, group = "pipe" }
ring = { default = 0.6, min = 0, max = 0.9, group = "pipe" }
sputter = { default = 0.5, min = 0, max = 1, group = "pipe" }
gain = { default = 1.0, min = 0, max = 2, group = "master" }

[signals]
level = "pow(pressure, 1.5) * (1 - sputter * (1 - pressure) * (0.5 + 0.5 * sh(14)))"

[graph]
nodes = [
  { id = "white", type = "noise" },
  { id = "throat", type = "svf", mode = "bandpass", in = ["white"], cutoff = "pipe_hz * (0.7 + 0.8 * pressure)", resonance = "pipe_res" },
  { id = "air", type = "svf", mode = "highpass", in = ["white"], cutoff = 3500, resonance = 0.1 },
  { id = "pipe", type = "comb", in = ["throat", { from = "air", gain = 0.15 }], ms = "1000 / pipe_hz", feedback = "ring", mix = 0.7 },
  { id = "out", type = "gain", in = ["pipe"], gain = "gain * level * 0.8" },
]
out = "out"
